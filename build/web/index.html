<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="AGENT - Beyond Housing. Nigeria's Trusted Real Estate Platform.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agent App">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AGENT - Beyond Housing</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #FFFFFF;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    .splash-logo {
      width: 200px;
      height: 85px;
      object-fit: contain;
      animation: pulse 1.8s infinite ease-in-out;
    }
    .splash-slogan {
      margin-top: 14px;
      font-size: 15px;
      font-weight: 600;
      color: #64748B;
      letter-spacing: 0.8px;
    }
    @keyframes pulse {
      0% { transform: scale(0.96); opacity: 0.9; }
      50% { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(0.96); opacity: 0.9; }
    }
    .spinner {
      margin-top: 24px;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(74, 67, 235, 0.15);
      border-radius: 50%;
      border-top-color: #4A43EB;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <img src="agent_logo.png" alt="Agent Logo" class="splash-logo">
    <div class="splash-slogan">Beyond Housing</div>
    <div class="spinner"></div>
  </div>
  <script>
    function removeSplash() {
      var splash = document.getElementById('loading-splash');
      if (splash && splash.parentNode) {
        splash.style.opacity = '0';
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }
    }

    // Listen for Flutter first frame event
    window.addEventListener('flutter-first-frame', removeSplash);

    // Fallback check if flutter element is mounted in DOM
    var checkInterval = setInterval(function() {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('canvas')) {
        removeSplash();
        clearInterval(checkInterval);
      }
    }, 200);

    // The splash screen will stay visible until 'flutter-first-frame' 
    // or until the fallback interval detects the flutter view.
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) {
          regs[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
    <script>
    // WebRTC Audio Autoplay & Unmute Guardian
    // Guarantees all remote audio tracks created by flutter_webrtc are unmuted, visible to Chrome's audio pipeline, and playing immediately.
    (function() {
      function unlockWebRTCAudio() {
        var mgr = document.getElementById('html_webrtc_audio_manager_list');
        if (mgr) {
          mgr.style.display = 'block';
          mgr.style.position = 'fixed';
          mgr.style.top = '-9999px';
          mgr.style.left = '-9999px';
          mgr.style.width = '1px';
          mgr.style.height = '1px';
          mgr.style.opacity = '0.01';
          mgr.style.pointerEvents = 'none';
        }

        var audios = document.querySelectorAll('audio');
        for (var i = 0; i < audios.length; i++) {
          var a = audios[i];
          a.muted = false;
          a.volume = 1.0;
          a.setAttribute('playsinline', 'true');
          a.setAttribute('webkit-playsinline', 'true');
          if (a.paused && a.srcObject) {
            var p = a.play();
            if (p && typeof p.catch === 'function') {
              p.catch(function() {});
            }
          }
        }

        var videos = document.querySelectorAll('video');
        for (var j = 0; j < videos.length; j++) {
          var v = videos[j];
          v.setAttribute('playsinline', 'true');
          v.setAttribute('webkit-playsinline', 'true');
          if (v.paused && v.srcObject) {
            var vp = v.play();
            if (vp && typeof vp.catch === 'function') {
              vp.catch(function() {});
            }
          }
        }
      }

      window.unmuteWebRTC = unlockWebRTCAudio;

      var observer = new MutationObserver(function() {
        unlockWebRTCAudio();
      });

      if (document.body) {
        observer.observe(document.body, { childList: true, subtree: true });
      } else {
        document.addEventListener('DOMContentLoaded', function() {
          observer.observe(document.body, { childList: true, subtree: true });
        });
      }

      var userEvents = ['click', 'touchstart', 'touchend'];
      for (var k = 0; k < userEvents.length; k++) {
        window.addEventListener(userEvents[k], function() {
          unlockWebRTCAudio();
        }, { passive: true });
      }

      setInterval(unlockWebRTCAudio, 1000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
