name = "agent-api"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Non-secret config — safe to put here
FIREBASE_PROJECT_ID = "agent-app-67bc4"
ALLOWED_ORIGIN = "https://my-agent-app-teal.vercel.app"

# For local development with wrangler dev:
# Copy .dev.vars.example to .dev.vars and fill in values

# Rate-limit storage for /payments/withdraw and /escrow/verify-pin.
# Create with: wrangler kv:namespace create RATE_LIMIT_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "31b0e92940d94c2b9c3cd928813d8cf5"
